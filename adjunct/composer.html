<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite Composer Playground</title>
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --bg-panel: #252526;
            --text-main: #cccccc;
            --accent: #007acc;
            --border: #333333;
        }
        body {
            margin: 0; padding: 0; background-color: var(--bg-dark); color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            grid-template-rows: 1fr 200px;
            height: 100vh; overflow: hidden;
        }
        
        /* Panels */
        .panel { background-color: var(--bg-panel); border: 1px solid var(--border); display: flex; flex-direction: column; }
        .panel-header { background-color: #2d2d30; padding: 8px 12px; font-weight: bold; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); }
        .panel-content { padding: 10px; overflow-y: auto; flex-grow: 1; }

        /* Left: Hierarchy */
        #hierarchy-panel { grid-column: 1; grid-row: 1 / 3; }
        .bone-item { padding: 4px 8px; cursor: pointer; font-size: 14px; user-select: none; }
        .bone-item:hover { background-color: #3f3f46; }
        .bone-item.selected { background-color: var(--accent); color: white; }
        .indent { margin-left: 15px; border-left: 1px dashed #555; padding-left: 10px; }

        /* Center: Viewport */
        #viewport-panel { grid-column: 2; grid-row: 1; position: relative; display: flex; justify-content: center; align-items: center; background-color: #1a1a1a; overflow: hidden; }
        canvas { 
            background-image: 
                linear-gradient(45deg, #222 25%, transparent 25%), 
                linear-gradient(-45deg, #222 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #222 75%), 
                linear-gradient(-45deg, transparent 75%, #222 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Right: Inspector */
        #inspector-panel { grid-column: 3; grid-row: 1 / 3; }
        .prop-group { margin-bottom: 15px; }
        .prop-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }
        .prop-row { display: flex; gap: 10px; }
        input[type="number"], select { width: 100%; background: #3c3c3c; color: white; border: 1px solid #555; padding: 4px; border-radius: 3px; }
        input[type="range"] { width: 100%; }

        /* Bottom: Timeline (Placeholder for Phase 3) */
        #timeline-panel { grid-column: 2; grid-row: 2; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

    <div id="hierarchy-panel" class="panel">
        <div class="panel-header">
            Rig Hierarchy
            <br><br>
            <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                <button id="btn-new-rig" style="flex: 1; font-size: 11px;">New Rig</button>
                <button id="btn-add-bone" style="flex: 1; font-size: 11px;">+ Bone</button>
                <button id="btn-delete-bone" style="flex: 1; font-size: 11px; color: #ff5555;">Del</button>
            </div>
            <button id="btn-auto-align" style="width: 100%; font-size: 11px; margin-bottom: 10px; background-color: #28a745; color: white; border: none; padding: 4px; cursor: pointer;">
                ✨ Auto-Align to Original Image ✨
            </button>
            
            <input type="file" id="local-asset-upload" multiple accept="image/png" style="font-size: 10px; width: 100%;">
            <div style="font-size: 10px; color: #888; margin-top: 4px;">Upload full-size PNGs to auto-crop & align.</div>
        </div>
        <div class="panel-content" id="hierarchy-tree">
            </div>
    </div>

    <div id="viewport-panel">
        <div style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 5px; z-index: 10; display: flex; flex-direction: column; align-items: center;">
            <label style="color: white; font-size: 10px; margin-bottom: 5px;">Zoom: <span id="zoom-val">100%</span></label>
            <input type="range" id="zoom-slider" min="0.1" max="2.0" step="0.05" value="1.0">
        </div>

        <canvas id="composer-canvas" width="2000" height="2000" style="max-width: 100%; max-height: 100%; object-fit: contain;"></canvas>
    </div>

    <div id="inspector-panel" class="panel">
        <div class="panel-header">Inspector</div>
        <div class="panel-content" id="inspector-content">
            <div id="no-selection">Select a bone to edit properties...</div>
            <div id="bone-props" style="display: none;">
                <h3 id="prop-bone-name" style="margin-top: 0;">Bone Name</h3>
                
                <div class="prop-group">
                    <label>Asset ID (Skin)</label>
                    <select id="prop-asset-id">
                        <option value="none">None (Invisible Bone)</option>
                        </select>
                </div>

                <div class="prop-group">
                    <label>Default Offset (X, Y) relative to parent</label>
                    <div class="prop-row">
                        <input type="number" id="prop-offset-x" step="1">
                        <input type="number" id="prop-offset-y" step="1">
                    </div>
                </div>

                <div class="prop-group">
                    <label>Pivot Point (Normalized 0.0 - 1.0)</label>
                    <div class="prop-row">
                        <input type="number" id="prop-pivot-x" step="0.05" min="0" max="1">
                        <input type="number" id="prop-pivot-y" step="0.05" min="0" max="1">
                    </div>
                </div>

                <div class="prop-group">
                    <label>Rotation (Degrees)</label>
                    <input type="range" id="prop-rotation-slider" min="-180" max="180" value="0">
                    <input type="number" id="prop-rotation" step="1">
                </div>
            </div>
        </div>
    </div>

    <div id="timeline-panel" class="panel">
        <div class="panel-header">Timeline / Animations</div>
        <div class="panel-content">
            <button id="btn-export">Export Rig & Skin JSON</button>
            <p style="font-size: 12px; color: #888;">Timeline features coming in Phase 3.</p>
        </div>
    </div>

    <script type="module" src="js/ComposerApp.js"></script>
</body>
</html>
